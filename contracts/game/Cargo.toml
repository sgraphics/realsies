[package]
name = "realsies-game"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
publish = false
description = "Realsies game contract: coins, plays, calls, character commitments, enclave-signed openings, settlement"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.29.1", features = ["unstable"] }
uint = { version = "0.9", default-features = false }

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing", "unstable"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = "symbols"
