# Realsies on realsies.xyz and realsies.lol, behind Cloudflare.
# Port 80 serves the app directly: works with Cloudflare "Flexible" and lets ACME HTTP-01 through.
# Port 4443 terminates TLS for Cloudflare "Full": port 443 on this host is the SNI stream proxy to 4443.
# The relay (API, WebSocket, static web app) listens on 127.0.0.1:3960.

upstream realsies_relay {
    server 127.0.0.1:3960;
    keepalive 16;
}

map $http_upgrade $realsies_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name realsies.xyz www.realsies.xyz realsies.lol www.realsies.lol;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    error_page 502 503 504 /realsies-down.html;
    location = /realsies-down.html { root /var/www/realsies; internal; }

    location / {
        proxy_pass http://realsies_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $realsies_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 4443 ssl;
    server_name realsies.xyz www.realsies.xyz realsies.lol www.realsies.lol;

    # Let's Encrypt, DNS-01 through Cloudflare, renewed by the certbot timer (cert name "realsies").
    ssl_certificate /etc/letsencrypt/live/realsies/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realsies/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    error_page 502 503 504 /realsies-down.html;
    location = /realsies-down.html { root /var/www/realsies; internal; }

    location / {
        proxy_pass http://realsies_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $realsies_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
