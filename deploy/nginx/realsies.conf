# Realsies behind Cloudflare. realsies.lol is the front door; realsies.xyz, www.realsies.xyz and
# www.realsies.lol answer with a permanent redirect to it, path and query kept.
# Port 80 serves the app directly: works with Cloudflare "Flexible" and lets ACME HTTP-01 through.
# Port 4443 terminates TLS for Cloudflare "Full": port 443 on this host is the SNI stream proxy to 4443.
# Two relays: the testnet game on 127.0.0.1:3960 (test.realsies.lol, test players for judges) and the mainnet game on
# 127.0.0.1:3961 (realsies-mainnet.service). realsies.lol serves whatever realsies_front points at: the testnet relay
# until the mainnet launch, then the mainnet relay (change one port, nginx -t, reload).

upstream realsies_relay {
    server 127.0.0.1:3960;
    keepalive 16;
}

upstream realsies_front {
    server 127.0.0.1:3960;
    keepalive 16;
}

map $http_upgrade $realsies_upgrade {
    default upgrade;
    ''      close;
}

# ---------- redirects to https://realsies.lol ----------

server {
    listen 80;
    listen [::]:80;
    server_name realsies.xyz www.realsies.xyz www.realsies.lol;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://realsies.lol$request_uri;
    }
}

server {
    listen 4443 ssl;
    server_name realsies.xyz www.realsies.xyz www.realsies.lol;

    ssl_certificate /etc/letsencrypt/live/realsies/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realsies/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://realsies.lol$request_uri;
}

# ---------- the app on realsies.lol ----------

server {
    listen 80;
    listen [::]:80;
    server_name realsies.lol;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Trailer page: static files outside the relay and outside git (deploy/trailer/ + the rendered MP4)
    location = /trailer {
        alias /var/www/realsies/trailer/index.html;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }
    location = /trailer/ {
        return 302 /trailer;
    }
    location /trailer/ {
        alias /var/www/realsies/trailer/;
        index index.html;
        add_header Cache-Control "public, max-age=300";
    }

    error_page 502 503 504 /realsies-down.html;
    location = /realsies-down.html { root /var/www/realsies; internal; }

    location / {
        proxy_pass http://realsies_front;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $realsies_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 4443 ssl;
    server_name realsies.lol;

    # Let's Encrypt, DNS-01 through Cloudflare, renewed by the certbot timer (cert name "realsies").
    ssl_certificate /etc/letsencrypt/live/realsies/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realsies/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Trailer page: static files outside the relay and outside git (deploy/trailer/ + the rendered MP4)
    location = /trailer {
        alias /var/www/realsies/trailer/index.html;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }
    location = /trailer/ {
        return 302 /trailer;
    }
    location /trailer/ {
        alias /var/www/realsies/trailer/;
        index index.html;
        add_header Cache-Control "public, max-age=300";
    }

    error_page 502 503 504 /realsies-down.html;
    location = /realsies-down.html { root /var/www/realsies; internal; }

    location / {
        proxy_pass http://realsies_front;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $realsies_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

