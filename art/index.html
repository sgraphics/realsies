<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Realsies art demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #181425; color: #ead4aa; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; position: absolute; left: 0; top: 0; }
      #bar { position: fixed; left: 8px; bottom: 8px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; background: rgba(24,20,37,.85); padding: 6px; border: 2px solid #feae34; }
      button { font: inherit; background: #3a4466; color: #fff; border: 2px solid #181425; padding: 6px 10px; cursor: pointer; }
      button.on { background: #feae34; color: #3e2731; }
      #info { position: fixed; right: 8px; bottom: 8px; z-index: 2; background: rgba(24,20,37,.85); padding: 6px 8px; max-width: 46vw; }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <div id="bar"></div>
    <div id="info"></div>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
